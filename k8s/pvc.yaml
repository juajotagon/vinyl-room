# Holds the archive: one JSON file and one cover per day (well under 1 MB/day).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vinyl-room-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
  # storageClassName: <your class>   # omit to use the cluster default
