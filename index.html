<!doctype html>
<html lang="en" data-skin="hud">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vinyl room</title>
    <meta name="description" content="A fresh album pick every day, on a spinning record." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💿</text></svg>" />
    <script>
      // Pick the skin before first paint: ?skin=… wins, then the last one used.
      (() => {
        const skins = ['hud', 'bubble', 'grid'];
        let skin = new URLSearchParams(location.search).get('skin');
        try {
          skin ??= localStorage.getItem('skin');
        } catch {}
        if (skins.includes(skin)) document.documentElement.dataset.skin = skin;
      })();
    </script>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <canvas id="scene" aria-label="Spinning record. Click to open the sleeve."></canvas>

    <header class="topbar">
      <a class="brand" href="#" data-today><span class="brand-a">vinyl</span><span class="brand-b">room</span></a>
      <span class="tagline">one fresh album a day</span>
      <nav class="topnav" aria-label="Main">
        <a href="#" data-today><span class="n">01</span>today</a>
        <a href="#" data-view="archive"><span class="n">02</span>archive</a>
        <a href="#" data-view="about"><span class="n">03</span>about</a>
      </nav>
      <label class="skinpick">
        <span>skin</span>
        <select id="skin">
          <option value="hud">2advanced</option>
          <option value="bubble">y2k bubble</option>
          <option value="grid">swiss grid</option>
        </select>
      </label>
    </header>

    <aside class="window" id="panel" hidden></aside>

    <footer class="statusbar">
      <span class="led" aria-hidden="true"></span>
      <span id="hint">click the record to open the sleeve</span>
      <span class="keys">← → browse days · space opens</span>
      <span class="ticker" aria-hidden="true"><span id="ticker"></span></span>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
